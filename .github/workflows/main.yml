```yaml
name: Terraform CI-CD

on:
  push:
    branches:
      - feature/dev-rg
      - main

permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: "1.14.6"
  ARM_USE_OIDC: true

jobs:

  # ==========================================================
  # FEATURE BRANCH - SECURITY SCAN
  # ==========================================================

  scan-feature:
    name: Security Scan - Feature
    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/feature/dev-rg'

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: modules/dev
          soft_fail: false


  # ==========================================================
  # FEATURE BRANCH - TERRAFORM PLAN
  # ==========================================================

  plan-feature:
    name: Terraform Plan - Feature
    runs-on: ubuntu-latest

    needs: scan-feature

    if: github.ref == 'refs/heads/feature/dev-rg'

    defaults:
      run:
        working-directory: modules/dev

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login using OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan


  # ==========================================================
  # MAIN BRANCH - SECURITY SCAN
  # ==========================================================

  scan-main:
    name: Security Scan - Main
    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/main'

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: modules/dev
          soft_fail: false


  # ==========================================================
  # MAIN BRANCH - TERRAFORM PLAN
  # ==========================================================

  plan-main:
    name: Terraform Plan - Main
    runs-on: ubuntu-latest

    needs: scan-main

    if: github.ref == 'refs/heads/main'

    defaults:
      run:
        working-directory: modules/dev

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login using OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: modules/dev/tfplan


  # ==========================================================
  # MAIN BRANCH - TERRAFORM APPLY
  # ==========================================================

  apply:
    name: Terraform Apply - Main
    runs-on: ubuntu-latest

    needs: plan-main

    if: github.ref == 'refs/heads/main'

    environment:
      name: production

    defaults:
      run:
        working-directory: modules/dev

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login using OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: modules/dev

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

