
on:
  push:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Verify Login
        run: az account show

      - name: Terraform installer
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.6"

      - run: terraform init
      - run: terraform plan
      - run: terraform apply -auto-approve
      
